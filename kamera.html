<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeszyt – zdjęcie kartki</title>
<style>
body{margin:0;background:#0a1428;color:#fff;font:18px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;text-align:center}
h1{font-size:24px;margin:4px 0}
video,img{max-width:96vw;max-height:60vh;border-radius:12px;background:#000}
button{font:inherit;font-size:22px;padding:14px 26px;border-radius:12px;border:0;cursor:pointer;margin:4px 6px}
button:disabled{opacity:.5;cursor:default}
.go{background:#2e7d4f;color:#fff}.ghost{background:transparent;color:#fff;border:1px solid #fff}
#m{color:#ffd27a;max-width:680px;min-height:1.4em}
#cam{font-size:15px;color:#9fb3d1}
.hide{display:none!important}
</style></head><body>
<h1>📷 Zdjęcie kartki do zeszytu</h1>
<div id="tip">Połóż kartkę z rozwiązaniem przed sobą. Kliknij <b>Zrób zdjęcie</b> – kamera włączy się dopiero wtedy.</div>
<video id="v" class="hide" autoplay playsinline muted></video>
<img id="pv" class="hide" alt="Twoje zdjęcie">
<div id="m"></div>
<div id="s0"><button id="start" class="go" type="button">📸 Zrób zdjęcie</button></div>
<div id="s1" class="hide"><button id="shot" class="go" type="button">📸 Pstryk! (albo spacja)</button><button id="cancel" class="ghost" type="button">Anuluj</button></div>
<div id="s2" class="hide"><button id="send" class="go" type="button">✅ Wyślij zdjęcie</button><button id="again" class="ghost" type="button">↺ Zrób ponownie</button></div>
<div id="cam">Kamera: wyłączona</div>
<canvas id="cv" class="hide"></canvas>
<form id="f" method="post" action="https://script.google.com/macros/s/AKfycbxahliro50i3e354pZ44g-9YJQq5FkCdjNY2toItmsWgaSTPJ1bjOKpywqXKG8gA2FRhw/exec"><input type="hidden" name="img" id="i"></form>
<script>
var S=null,T=null,$=function(x){return document.getElementById(x)};
function msg(t){$('m').innerHTML=t}
function show(st){['s0','s1','s2'].forEach(function(k){$(k).classList.toggle('hide',k!==st)})}
function camOn(on){$('cam').textContent=on?'🔴 Kamera: włączona':'Kamera: wyłączona'}
function stop(){clearTimeout(T);try{S.getTracks().forEach(function(t){t.stop()})}catch(e){}S=null;$('v').srcObject=null;$('v').classList.add('hide');camOn(false)}
function err(e){stop();show('s0');msg('Kamera się nie włączyła ('+((e&&e.name)||'?')+'). W Safari kliknij menu <b>Safari → Ustawienia dla tej witryny</b> i przy <b>Kamera</b> wybierz <b>Zezwalaj</b>. Potem kliknij <b>Zrób zdjęcie</b> jeszcze raz.')}
function start(){$('pv').classList.add('hide');$('i').value='';msg('Włączam kamerę… Jeśli Safari zapyta o kamerę, kliknij <b>Zezwól</b>.');$('start').disabled=true;
 try{navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},height:{ideal:1080}},audio:false}).then(function(s){S=s;$('v').srcObject=s;$('v').classList.remove('hide');camOn(true);$('start').disabled=false;show('s1');
  msg('Pokaż kartkę do kamery – prosto i blisko. Gdy pismo jest ostre, kliknij <b>Pstryk!</b>');
  clearTimeout(T);T=setTimeout(function(){stop();show('s0');msg('Kamera wyłączyła się sama po 2 minutach. Kliknij <b>Zrób zdjęcie</b>, gdy będziesz gotowa.')},120000)}).catch(function(e){$('start').disabled=false;err(e)})}catch(e){$('start').disabled=false;err(e)}}
function shot(){var v=$('v');if(!S||!v.videoWidth){err({name:'brak obrazu'});return}
 var k=Math.min(1,1500/Math.max(v.videoWidth,v.videoHeight)),c=$('cv');c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
 c.getContext('2d').drawImage(v,0,0,c.width,c.height);var d=c.toDataURL('image/jpeg',0.8);stop();
 $('i').value=d;$('pv').src=d;$('pv').classList.remove('hide');show('s2');
 msg('Kamera wyłączona. Czy całe rozwiązanie jest ostre i czytelne? Jeśli tak – <b>Wyślij zdjęcie</b>. Jeśli nie – <b>Zrób ponownie</b>.')}
function send(){if(!$('i').value)return;stop();$('send').disabled=true;$('again').disabled=true;msg('Wysyłam zdjęcie…');$('f').submit()}
$('start').onclick=start;$('shot').onclick=shot;$('again').onclick=start;$('send').onclick=send;
$('cancel').onclick=function(){stop();show('s0');msg('')};
addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){if(!$('s1').classList.contains('hide')){e.preventDefault();shot()}}});
addEventListener('pagehide',stop);
document.addEventListener('visibilitychange',function(){if(document.hidden&&S){stop();show('s0');msg('Kamera wyłączona, bo przełączyłaś okno. Kliknij <b>Zrób zdjęcie</b>, gdy będziesz gotowa.')}});
</script></body></html>
